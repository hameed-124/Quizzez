<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/login-signup.css">
    <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon">
    <title>Sign Up | Ludiflex</title>
    <style>
        input::placeholder {
            color: rgba(17, 17, 17, 0.5);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <header>Sign Up</header>
        </div>
        <div class="input-box">
            <input type="text" class="input-field" placeholder="Username" autocomplete="off" required>
        </div>
        <div class="input-box">
            <input type="email" class="input-field" placeholder="Email" autocomplete="off" required>
        </div>
        <div class="input-box">
            <input type="password" class="input-field" placeholder="Password" autocomplete="off" required>
        </div>
        <div class="input-submit">
            <button class="submit-btn" id="submit" onclick="redirectToLogin()"></button>
            <label for="submit">Sign Up</label>
        </div>
        <div class="sign-up-link">
            <p>Already have an account? <a href="index.html">Sign In</a></p>
        </div>
    </div>

    <script>
        function redirectToLogin() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
